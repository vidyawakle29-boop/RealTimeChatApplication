{% extends "base.html" %}

{% block title %}Sign In | ChatPulse Real-Time Chat{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Background Glows -->
    <div class="auth-glow glow-1"></div>
    <div class="auth-glow glow-2"></div>

    <div class="auth-card animate-fade-in">
        <div class="auth-card-header">
            <div class="auth-header-top">
                <a href="{{ url_for('chat.index') }}" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Home
                </a>
                <button class="theme-toggle-btn small" onclick="toggleTheme()" title="Toggle Theme">
                    <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
            <div class="auth-brand">
                <div class="logo-icon large">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your account and jump back into the conversation.</p>
            </div>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="login_id">Username or Email</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="login_id" 
                        name="login_id" 
                        class="form-control" 
                        placeholder="john_doe or john@example.com"
                        value="{{ login_id or '' }}" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label for="password">Password</label>
                </div>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-row-between">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember" id="remember" checked>
                    <span class="checkmark"></span>
                    <span class="label-text">Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="auth-card-footer">
            <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="link-highlight">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePasswordVisibility(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }
</script>
{% endblock %}
